name: Publish patched ORT image

on:
  push:
    branches: [ort-image]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        env:
          IMAGE: ghcr.io/gosimulate/nuget-inspector-ort
        run: |
          docker build -f Dockerfile.ort -t "$IMAGE:fix-75" -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:fix-75"
          docker push "$IMAGE:${GITHUB_SHA::12}"
